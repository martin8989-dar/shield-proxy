# Configuracion de Nginx para el Nodo Escudo (Reverse Proxy)
# Reenvia las peticiones al servidor de la oficina por el tunel (10.0.0.2:8000)

server {
    listen 80;
    server_name _;

    # Ocultar la version de Nginx en respuestas y errores
    server_tokens off;

    # Pagina personalizada 503 por si el tunel con la oficina se cae
    error_page 500 502 503 504 =503 /503.html;

    location = /503.html {
        root /var/www/html/errors;
        internal;
    }

    location / {
        proxy_pass http://10.0.0.2:8000;

        # Pasar la IP real del visitante a la oficina
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ocultar cabeceras sensibles que vengan del servidor de origen
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;

        # Tiempos cortos para mostrar rapido el 503 si se corta el tunel
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_intercept_errors on;
    }
}
