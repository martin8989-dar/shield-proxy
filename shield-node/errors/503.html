<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Error 503 - Servicio no disponible</title>
    <style>
        body {
            background-color: #121826;
            color: #f0f4f8;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }
        .caja {
            max-width: 500px;
            margin: 0 auto;
            background-color: #1f2937;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #374151;
        }
        h1 {
            color: #f59e0b;
            font-size: 24px;
        }
        p {
            color: #cbd5e1;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="caja">
        <h1>503 - Servicio Temporalmente No Disponible</h1>
        <p>En este momento no podemos procesar la solicitud porque el sistema se encuentra en mantenimiento.</p>
        <p>Por favor intenta entrar de nuevo en unos minutos.</p>
    </div>
</body>
</html>
